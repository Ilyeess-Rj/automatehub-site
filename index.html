  <style>
    :root {
      --bg-dark: #070913;
      --bg-card: rgba(15, 23, 42, 0.65);
      --bg-input: rgba(15, 23, 42, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(99, 102, 241, 0.4);
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #6366f1 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient Glows */
    .glow-ambient-1 {
      position: fixed;
      top: -150px;
      left: 20%;
      width: 600px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(139, 92, 246, 0.08) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(40px);
    }

    .glow-ambient-2 {
      position: fixed;
      bottom: -150px;
      right: 15%;
      width: 550px;
      height: 450px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(50px);
    }

    /* Top Navigation Header */
    header {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo-img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.6));
      border-radius: 10px;
    }

    .brand-text h1 {
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(90deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      display: block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-radius: 999px;
      color: #34d399;
      font-size: 12px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .clear-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    /* Main Container */
    main {
      flex: 1;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 20px 20px;
      overflow: hidden;
    }

    /* Chat Messages Box */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px 10px 100px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scrollbar-width: thin;

    }

      border-radius: 4px;
    }

    /* Welcome Hero View */
    .welcome-container {
      margin: auto;
      text-align: center;
      max-width: 620px;
      padding: 25px 20px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .welcome-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(236, 72, 153, 0.75)) drop-shadow(0 0 35px rgba(168, 85, 247, 0.4));
      transition: transform 0.3s ease;
    }

    .welcome-avatar img:hover {
      transform: scale(1.06);
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-desc {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Prompt Chips */
    .chips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      direction: rtl;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 16px;
      color: #e2e8f0;
      text-align: right;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
    }

    .chip-btn:hover {
      background: rgba(99, 102, 241, 0.12);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }

    .chip-icon {
      font-size: 18px;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      gap: 12px;
      width: 100%;
      animation: msgPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes msgPop {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      justify-content: flex-start;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .msg-row.bot .msg-avatar {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .msg-row.user .msg-avatar {
      background: rgba(255, 255, 255, 0.1);
      color: var(--accent-cyan);
      border: 1px solid var(--border-subtle);
    }

    .msg-content-wrapper {
      max-width: 82%;
      display: flex;
      flex-direction: column;
    }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.65;
      position: relative;
      word-break: break-word;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(99, 102, 241, 0.35) 100%);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }

    .msg-row.bot .msg-bubble {
      background: rgba(18, 25, 44, 0.8);
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    .msg-bubble p {
      margin-bottom: 8px;
    }
    .msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .msg-bubble ul, .msg-bubble ol {
      padding-right: 20px;
      margin-bottom: 8px;
    }

    .msg-bubble strong {
      color: #ffffff;
      font-weight: 700;
    }

    .msg-bubble code {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
    }

    .msg-bubble pre {
      background: #030712;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .msg-bubble pre code {
      background: transparent;
      padding: 0;
      color: #a5f3fc;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 4px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #818cf8;
      animation: typingBounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Bottom Dock / Input Area */
    .input-dock {
      position: absolute;
      bottom: 14px;
      left: 20px;
      right: 20px;
      max-width: 960px;
      margin: 0 auto;
      z-index: 30;
      background: rgba(13, 19, 36, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      padding: 8px 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.15);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      min-height: 26px;
      padding: 8px 6px;
      line-height: 1.5;
    }

    #user-input::placeholder {
      color: #64748b;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--primary-gradient);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Responsive */
    @media (max-width: 640px) {
      header {
        padding: 10px 16px;
      }
      .brand-text h1 {
        font-size: 16px;
      }
      .brand-logo-img {
        width: 34px;
        height: 34px;
      }
      .status-badge span {
        display: none;
      }
      .status-badge {
        padding: 6px 8px;
      }
      main {
        padding: 10px 10px 10px;
      }
      .input-dock {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }
      .welcome-title {
        font-size: 22px;
      }
      .msg-content-wrapper {
        max-width: 90%;
      }
      .chips-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="glow-ambient-1"></div>
  <div class="glow-ambient-2"></div>

  <!-- Header -->
  <header>
    <a href="/" class="brand-group">
      <img src="logo.png" alt="AutomateHub" class="brand-logo-img">
      <div class="brand-text">
        <h1>AutomateHub</h1>
        <span>MIR • Intelligent Agent</span>
      </div>
    </a>

    <div class="header-actions">
      <div class="status-badge" title="الوكيل الذكي متصل وجاهز للخدمة 24/7">
        <span class="status-dot"></span>
        <span>MIR Live 24/7</span>
      </div>
      <button class="clear-btn" id="clear-chat-btn" title="مسح المحادثة">
        <span>🗑️</span>
        <span style="display: inline-block;">مسح</span>
      </button>
    </div>
  </header>

  <!-- Main Chat Window -->
  <main>
    <div id="chat-box">
      <!-- Welcome Screen (Visible initially) -->
      <div class="welcome-container" id="welcome-view">
        <div class="welcome-avatar">
          <img src="logo.png" alt="MIR">
        </div>
        <h2 class="welcome-title">أهلاً بك! أنا MIR ⚡</h2>
        <p class="welcome-desc">الوكيل الذكي الرسمي لمنصة <b>AutomateHub</b>. أستطيع الإجابة عن كل تساؤلاتك، البحث المباشر في الأخبار ومباريات اليوم، إجراء العمليات الحسابية، وتقديم خدمات الأتمتة.</p>

        <div class="chips-grid">
          <button class="chip-btn" onclick="sendPrompt('ما هي نتيجة آخر مباراة لبرشلونة اليوم؟')">
            <span class="chip-icon">⚽</span>
            <span>نتيجة آخر مباراة لبرشلونة اليوم</span>
          </button>
          <button class="chip-btn" onclick="sendPrompt('ما هي أحدث أخبار الذكاء الاصطناعي اليوم؟')">
            <span class="chip-icon">📰</span>
            <span>أحدث أخبار الذكاء الاصطناعي اليوم</span>
          </button>
          <button class="chip-btn" onclick="sendPrompt('احسب لي بدقة: (450 * 1.19) - 85')">
            <span class="chip-icon">🧮</span>
            <span>احسب: (450 * 1.19) - 85</span>
          </button>
          <button class="chip-btn" onclick="sendPrompt('عرفني على مشروع ومنصة AutomateHub وخدماتها؟')">
            <span class="chip-icon">🚀</span>
            <span>ما هي منصة وخدمات AutomateHub؟</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Floating Input Dock -->
    <div class="input-dock">
      <textarea id="user-input" rows="1" placeholder="اسأل MIR أي شيء... (بحث مباشر، حساب، استفسار)" autofocus></textarea>
      <button class="send-btn" id="send-btn" title="إرسال">⚡</button>
    </div>
  </main>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-chat-btn');
    const welcomeView = document.getElementById('welcome-view');

    let chatHistory = [];
    let isGenerating = false;

    // Auto resize textarea
    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
    });

    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    clearBtn.addEventListener('click', function() {
      chatHistory = [];
      chatBox.innerHTML = '';
      chatBox.appendChild(welcomeView);
      welcomeView.style.display = 'block';
    });

    function sendPrompt(text) {
      userInput.value = text;
      sendMessage();
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message || isGenerating) return;

      // Hide welcome view
      if (welcomeView && welcomeView.style.display !== 'none') {
        welcomeView.style.display = 'none';
      }

      // Add user bubble
      appendMessage('user', message);
      userInput.value = '';
      userInput.style.height = 'auto';
      userInput.focus();

      // Show typing indicator
      const typingEl = appendTyping();
      isGenerating = true;
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            history: chatHistory
          })
        });

        if (!response.ok) {
          throw new Error('فشل الاتصال بالخادم (' + response.status + ')');
        }

        const contentType = response.headers.get('content-type') || '';

        if (contentType.includes('text/event-stream') && response.body) {
          if (typingEl) typingEl.remove();

          const botRow = appendMessage('bot', '');
          const botBubble = botRow.querySelector('.msg-bubble');

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullText = '';
          let buffer = '';

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('data: ')) {
                const dataStr = trimmed.slice(6).trim();
                if (dataStr === '[DONE]') continue;
                try {
                  const json = JSON.parse(dataStr);
                  const token = json.choices?.[0]?.delta?.content || '';
                  if (token) {
                    fullText += token;
                    botBubble.innerHTML = marked.parse(fullText);
                    chatBox.scrollTop = chatBox.scrollHeight;
                  }
                } catch (e) {}
              }
            }
          }

          if (!fullText) {
            botBubble.textContent = 'عذراً، لم أتمكن من الحصول على إجابة.';
          } else {
            chatHistory.push({ role: 'user', content: message });
            chatHistory.push({ role: 'assistant', content: fullText });
          }

        } else {
          const data = await response.json();
          if (typingEl) typingEl.remove();
          const reply = data.reply || data.error || 'عذراً، لم أتلقَّ رداً.';
          appendMessage('bot', reply);
          chatHistory.push({ role: 'user', content: message });
          chatHistory.push({ role: 'assistant', content: reply });
        }

      } catch (err) {
        if (typingEl) typingEl.remove();
        appendMessage('bot', '⚠️ حدث خطأ في الاتصال: ' + err.message);
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'user' ? 'أنت' : 'MIR';

      const wrapper = document.createElement('div');
      wrapper.className = 'msg-content-wrapper';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      if (role === 'bot') {
        bubble.innerHTML = marked.parse(text);
      } else {
        bubble.textContent = text;
      }

      wrapper.appendChild(bubble);
      row.appendChild(avatar);
      row.appendChild(wrapper);

      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
      return row;
    }

    function appendTyping() {
      const row = document.createElement('div');
      row.className = 'msg-row bot';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = 'MIR';

      const wrapper = document.createElement('div');
      wrapper.className = 'msg-content-wrapper';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;

      wrapper.appendChild(bubble);
      row.appendChild(avatar);
      row.appendChild(wrapper);

      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
      return row;
    }
  </script>
</body>
</html>
